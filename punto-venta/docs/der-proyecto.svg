<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="900" viewBox="0 0 1400 900">
  <defs>
    <style>
      .bg { fill: #f7f9fc; }
      .table { fill: #ffffff; stroke: #7a97b8; stroke-width: 2; rx: 14; }
      .head { fill: #8fb0d4; }
      .headText { fill: #0f172a; font: 700 20px Arial, sans-serif; }
      .label { fill: #1f2937; font: 16px Consolas, monospace; }
      .small { fill: #475569; font: 14px Arial, sans-serif; }
      .title { fill: #0f172a; font: 700 28px Arial, sans-serif; }
      .rel { stroke: #4b5563; stroke-width: 3; stroke-dasharray: 10 8; fill: none; }
      .card { fill: #ffffff; stroke: #94a3b8; stroke-width: 2; rx: 12; }
      .cardTitle { fill: #111827; font: 700 18px Arial, sans-serif; }
      .cardText { fill: #111827; font: 15px Consolas, monospace; }
      .one { fill: #111827; font: 700 18px Arial, sans-serif; }
      .many { fill: #111827; font: 700 18px Arial, sans-serif; }
    </style>
  </defs>

  <rect class="bg" x="0" y="0" width="1400" height="900" rx="0"/>
  <text class="title" x="60" y="55">DER del proyecto</text>
  <text class="small" x="60" y="85">Modelo principal de entidades y relaciones del sistema de punto de venta</text>

  <!-- CATEGORIAS -->
  <rect class="table" x="70" y="210" width="250" height="190" rx="14"/>
  <rect class="head" x="70" y="210" width="250" height="38" rx="14"/>
  <text class="headText" x="88" y="235">categorias</text>
  <text class="label" x="90" y="275">🔑 id</text>
  <text class="label" x="90" y="302">nombre</text>
  <text class="label" x="90" y="329">descripcion</text>

  <!-- PRODUCT -->
  <rect class="table" x="70" y="80" width="300" height="270" rx="14"/>
  <rect class="head" x="70" y="80" width="300" height="38" rx="14"/>
  <text class="headText" x="88" y="105">product</text>
  <text class="label" x="90" y="145">🔑 id</text>
  <text class="label" x="90" y="172">name</text>
  <text class="label" x="90" y="199">price</text>
  <text class="label" x="90" y="226">categoria_id</text>
  <text class="label" x="90" y="253">stock</text>
  <text class="label" x="90" y="280">activo</text>

  <!-- CLIENTE -->
  <rect class="table" x="1010" y="490" width="280" height="300" rx="14"/>
  <rect class="head" x="1010" y="490" width="280" height="38" rx="14"/>
  <text class="headText" x="1028" y="515">cliente</text>
  <text class="label" x="1030" y="555">🔑 id</text>
  <text class="label" x="1030" y="582">apellido</text>
  <text class="label" x="1030" y="609">direccion</text>
  <text class="label" x="1030" y="636">dni</text>
  <text class="label" x="1030" y="663">email</text>
  <text class="label" x="1030" y="690">nombre</text>
  <text class="label" x="1030" y="717">telefono</text>
  <text class="label" x="1030" y="744">activo</text>

  <!-- PEDIDOS -->
  <rect class="table" x="560" y="320" width="280" height="270" rx="14"/>
  <rect class="head" x="560" y="320" width="280" height="38" rx="14"/>
  <text class="headText" x="578" y="345">pedidos</text>
  <text class="label" x="580" y="385">🔑 id</text>
  <text class="label" x="580" y="412">confirmed_at</text>
  <text class="label" x="580" y="439">created_at</text>
  <text class="label" x="580" y="466">estado</text>
  <text class="label" x="580" y="493">total</text>
  <text class="label" x="580" y="520">updated_at</text>
  <text class="label" x="580" y="547">cliente_id</text>

  <!-- PEDIDO_ITEMS -->
  <rect class="table" x="970" y="120" width="350" height="250" rx="14"/>
  <rect class="head" x="970" y="120" width="350" height="38" rx="14"/>
  <text class="headText" x="988" y="145">pedido_items</text>
  <text class="label" x="990" y="185">🔑 id</text>
  <text class="label" x="990" y="212">cantidad</text>
  <text class="label" x="990" y="239">precio_unitario</text>
  <text class="label" x="990" y="266">subtotal</text>
  <text class="label" x="990" y="293">pedido_id</text>
  <text class="label" x="990" y="320">product_id</text>

  <!-- Relationships -->
  <path class="rel" d="M320 260 L430 260 L430 300 L560 300"/>
  <text class="one" x="374" y="248">1</text>
  <text class="many" x="528" y="294">1..*</text>

  <path class="rel" d="M840 410 L900 410 L900 365 L970 365"/>
  <text class="one" x="870" y="398">1</text>
  <text class="many" x="940" y="360">1..*</text>

  <path class="rel" d="M840 470 L910 470 L910 540 L1010 540"/>
  <text class="many" x="870" y="458">1..*</text>
  <text class="one" x="980" y="534">1</text>

  <path class="rel" d="M220 400 L220 470 L560 470"/>
  <text class="many" x="184" y="425">1..*</text>
  <text class="one" x="540" y="464">1</text>

  <!-- Legend -->
  <rect class="card" x="60" y="760" width="520" height="92" rx="14"/>
  <text class="cardTitle" x="82" y="792">Relaciones clave</text>
  <text class="cardText" x="82" y="820">Categoria 1 ─── * Product   |   Cliente 1 ─── * Pedido</text>
  <text class="cardText" x="82" y="845">Pedido 1 ─── * PedidoItem  |   Product 1 ─── * PedidoItem</text>
</svg>
